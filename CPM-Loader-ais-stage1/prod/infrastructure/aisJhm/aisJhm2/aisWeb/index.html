  <body onload="SetupPage()">
    <table width="100%"> 
      <tr background: #CCC>
         <td class="logoCell"><img id="CatLogo" border="0" src="Cat_logo.gif" align="left"></td>
         <td class="logoCell"><img id="Command" border="0" src="Command.gif" align="right"></td>
      </tr>
    </table>
    <!--=============================================================================================-->
      <!-- Put some distance between the Header and the parameters table -->
      <br />

       <!-- Middle: GPS, ABS, Logger -->

           -----   GPS1
           -------------------------------------------------------------------- --->

                <tr width="100%">
                   <td class="paramSectionHeader" colspan="6"><b>Primary GPS</b></td>
               </tr>
               <tr width="100%">
                   <td class="paramColumnHeader"><b>Parameter</b></td>

               <tr width="100%">

               <tr width="100%">
                   <td class="paramName">NorthingTop</td>

                      <div id="NorthingTop" align="center">---------</div>

               </tr>
               <tr width="100%">
                   <td class="paramName">NorthingBottom</td>

                      <div id="NorthingBottom" align="center">---------</div>
                   </td>
                   <td class="paramUnits" align="center">mm</td>
               </tr>               
               <tr width="100%">
                   <td class="paramName">Elevation</td>
                   <td class="paramValue">
                      <div id="Elevation" align="center">---------</div>
                   </td>
                   <td class="paramUnits" align="center">mm</td>
               </tr>      
            </table>
       
       </div>
