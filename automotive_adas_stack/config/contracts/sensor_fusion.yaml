contract:
  node:
    name: sensor_fusion
    executor:
      type: multi_threaded
      threads: 2
    parameter_ref: sensor_fusion_params

  callback_groups:
    - name: fusion_group
      type: reentrant

  interactions:
    - type: pub-sub
      role: producer
      dataref: fused_environment
      qos_profile: realtime_qos

  timers:
    - name: fusion_tick
      rate_hz: 50.0
      callback_group: fusion_group
