contract:
  node:
    name: path_planner
    executor:
      type: multi_threaded
      threads: 2
    parameter_ref: path_planner_params

  callback_groups:
    - name: planning_group
      type: mutually_exclusive

  interactions:
    - type: pub-sub
      role: consumer
      dataref: detected_objects
      qos_profile: reliable_qos
      callback_group: planning_group

    - type: pub-sub
      role: producer
      dataref: planned_path
      qos_profile: reliable_qos

  timers:
    - name: planning_cycle
      rate_hz: 20.0
      callback_group: planning_group
