contract:
  node:
    name: site_logger
    executor:
      type: single_threaded
      threads: 1
    parameter_ref: site_logger_params

  callback_groups:
    - name: log_group
      type: mutually_exclusive

  interactions:
    - type: pub-sub
      role: consumer
      dataref: payload_status
      qos_profile: cycle_qos
      callback_group: log_group

    - type: pub-sub
      role: consumer
      dataref: health_telemetry
      qos_profile: fleet_qos
      callback_group: log_group

    - type: pub-sub
      role: producer
      dataref: cycle_report
      qos_profile: fleet_qos

  timers:
    - name: log_tick
      rate_hz: 0.5
      callback_group: log_group
