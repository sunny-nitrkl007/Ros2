contract:
  node:
    name: fleet_monitor
    executor:
      type: multi_threaded
      threads: 2
    parameter_ref: fleet_monitor_params

  callback_groups:
    - name: monitor_group
      type: mutually_exclusive

  interactions:
    - type: pub-sub
      role: consumer
      dataref: bucket_state
      qos_profile: cycle_qos
      callback_group: monitor_group

    - type: pub-sub
      role: consumer
      dataref: truck_pose
      qos_profile: reliable_qos
      callback_group: monitor_group

    - type: pub-sub
      role: consumer
      dataref: payload_status
      qos_profile: cycle_qos
      callback_group: monitor_group

    - type: pub-sub
      role: producer
      dataref: health_telemetry
      qos_profile: fleet_qos

    - type: service
      role: server
      dataref: emergency_stop
      callback_group: monitor_group

  timers:
    - name: monitor_tick
      rate_hz: 1.0
      callback_group: monitor_group
