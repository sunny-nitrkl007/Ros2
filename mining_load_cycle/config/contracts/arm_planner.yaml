contract:
  node:
    name: arm_planner
    executor:
      type: multi_threaded
      threads: 2
    parameter_ref: arm_planner_params

  callback_groups:
    - name: arm_group
      type: mutually_exclusive
    - name: service_group
      type: reentrant

  interactions:
    - type: pub-sub
      role: consumer
      dataref: proximity_alert
      qos_profile: reliable_qos
      callback_group: arm_group

    - type: pub-sub
      role: producer
      dataref: dig_command
      qos_profile: reliable_qos

    - type: service
      role: client
      dataref: request_load

  timers:
    - name: dig_cycle
      rate_hz: 5.0
      callback_group: arm_group
