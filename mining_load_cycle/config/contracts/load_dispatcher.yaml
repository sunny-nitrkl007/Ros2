contract:
  node:
    name: load_dispatcher
    executor:
      type: multi_threaded
      threads: 2
    parameter_ref: load_dispatcher_params

  callback_groups:
    - name: dispatch_group
      type: mutually_exclusive
    - name: service_group
      type: reentrant

  interactions:
    - type: pub-sub
      role: consumer
      dataref: truck_pose
      qos_profile: reliable_qos
      callback_group: dispatch_group

    - type: pub-sub
      role: consumer
      dataref: payload_status
      qos_profile: cycle_qos
      callback_group: dispatch_group

    - type: pub-sub
      role: consumer
      dataref: proximity_alert
      qos_profile: reliable_qos
      callback_group: dispatch_group

    - type: pub-sub
      role: producer
      dataref: waypoint_command
      qos_profile: reliable_qos

    - type: pub-sub
      role: producer
      dataref: load_assignment
      qos_profile: fleet_qos

    - type: service
      role: server
      dataref: request_load
      callback_group: service_group

    - type: service
      role: client
      dataref: emergency_stop

  timers:
    - name: cycle_tick
      rate_hz: 2.0
      callback_group: dispatch_group
