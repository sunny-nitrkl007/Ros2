contract:
  node:
    name: proximity_detector
    executor:
      type: single_threaded
      threads: 1
    parameter_ref: proximity_detector_params

  callback_groups:
    - name: prox_group
      type: mutually_exclusive

  interactions:
    - type: pub-sub
      role: consumer
      dataref: truck_pose
      qos_profile: reliable_qos
      callback_group: prox_group

    - type: pub-sub
      role: producer
      dataref: proximity_alert
      qos_profile: reliable_qos

  timers:
    - name: proximity_check
      rate_hz: 10.0
      callback_group: prox_group
