# ==============================================================================
# Topics grammar
# ------------------------------------------------------------------------------
# ROS 2 communication is topic-based:
#   publisher endpoint -> topic contract <- subscriber endpoint
#
# This example models:
#   A -> C: a_to_c_status, a_to_c_command
#   A -> B: a_to_b_event
#   C -> A: c_to_a_feedback
#   B -> A: b_to_a_report
#   B -> B: b_internal_status loopback
# ===============================================================================
topics:
  - name: a_to_c_status
    topic_name: /matrix_demo/a_to_c/status
    message_type: std_msgs/msg/String
    qos_profile: reliable_default
    description: "Node A publishes status intended for Node C."

  - name: a_to_c_command
    topic_name: /matrix_demo/a_to_c/command
    message_type: std_msgs/msg/String
    qos_profile: reliable_default
    description: "Node A publishes command text intended for Node C."

  - name: a_to_b_event
    topic_name: /matrix_demo/a_to_b/event
    message_type: std_msgs/msg/String
    qos_profile: reliable_default
    description: "Node A publishes event text intended for Node B."

  - name: c_to_a_feedback
    topic_name: /matrix_demo/c_to_a/feedback
    message_type: std_msgs/msg/String
    qos_profile: reliable_default
    description: "Node C publishes feedback intended for Node A."

  - name: b_to_a_report
    topic_name: /matrix_demo/b_to_a/report
    message_type: std_msgs/msg/String
    qos_profile: reliable_default
    description: "Node B publishes report text intended for Node A."

  - name: b_internal_status
    topic_name: /matrix_demo/b/internal_status
    message_type: std_msgs/msg/String
    qos_profile: reliable_default
    description: "Node B loopback topic: B publishes and B subscribes."
