# ==============================================================================
# Execution grammar
# ------------------------------------------------------------------------------
# Controls the executor used in generated node main().
#
# Supported executor values:
#   single_threaded
#   multi_threaded
#
# Rules:
#   - single_threaded must use number_of_threads: 1
#   - multi_threaded should use number_of_threads >= 2
#
# Node-specific override example:
# execution:
#   node_overrides:
#     monitor_node:
#       executor: multi_threaded
#       number_of_threads: 4
# ===============================================================================
execution:
  default:
    executor: single_threaded
    number_of_threads: 1
  node_overrides: {}
