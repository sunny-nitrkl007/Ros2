parameter_profiles:

  # -------- Perception --------
  - name: perception_system_parameters
    description: "Perception system configuration"
    parameters:
      - name: sensor_update_rate_hz
        type: float64
        default: 20.0
        min: 0.1
        max: 100.0
        dynamic: true

      - name: obstacle_detection_range_m
        type: float64
        default: 100.0
        min: 1.0
        max: 300.0
        dynamic: true

      - name: enable_object_classification
        type: bool
        default: true
        dynamic: true

      - name: enable_debug_logging
        type: bool
        default: false
        dynamic: true


  # -------- Planning --------
  - name: planning_system_parameters
    description: "Planning system configuration"
    parameters:
      - name: planning_rate_hz
        type: float64
        default: 10.0
        min: 0.1
        max: 50.0
        dynamic: true

      - name: max_speed_mps
        type: float64
        default: 30.0
        min: 0.0
        max: 80.0
        dynamic: true

      - name: safe_follow_distance_m
        type: float64
        default: 10.0
        min: 1.0
        max: 100.0
        dynamic: true


  # -------- Safety --------
  - name: safety_system_parameters
    description: "Safety monitoring configuration"
    parameters:
      - name: emergency_brake_threshold
        type: float64
        default: 0.8
        min: 0.0
        max: 1.0
        dynamic: true

      - name: reaction_time_ms
        type: int32
        default: 100
        min: 1
        max: 10000
        dynamic: true

      - name: enable_emergency_override
        type: bool
        default: true
        dynamic: true
