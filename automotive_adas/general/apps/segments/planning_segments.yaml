segments:
  - name: planning_system
    interactions:
      - subscriber:
          - name: sub_obstacle_data
            topic_name: obstacle_data
            qos_profile: sub_default_qos

          - name: sub_emergency_brake
            topic_name: emergency_brake
            qos_profile: sub_default_qos

      - publisher:
          - name: pub_trajectory
            topic_name: trajectory
            qos_profile: pub_default_qos

      - service_client:
          - name: client_get_lane_info
            service_name: get_lane_info
            qos_profile: client_default_qos

          - name: client_check_risk
            service_name: check_risk
            qos_profile: client_default_qos

      - service_server:
          - name: server_request_path_update
            service_name: request_path_update
            qos_profile: server_default_qos

node:
    - name: planning1_node
      parameter_ref: planning_system_parameters
      interactions_ref:
        - sub_obstacle_data
        - sub_emergency_brake
        - pub_trajectory

    - name: planning2_node
      parameter_ref: planning_system_parameters
      interactions_ref:
        - client_get_lane_info
        - client_check_risk
        - server_request_path_update
