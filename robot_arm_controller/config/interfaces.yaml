# V3 change: single file replaces separate topics.yaml / services.yaml
# All interface types (msg, srv, action) live here as a named registry.
# Nodes reference these by name — not by inline type strings.

interfaces:
  messages:
    joint_commands:
      type: trajectory_msgs/msg/JointTrajectory
      default_topic: /robot1/joint_commands

    joint_states:
      type: sensor_msgs/msg/JointState
      default_topic: /robot1/joint_states

    arm_status:
      type: std_msgs/msg/String
      default_topic: /robot1/arm_status

    collision_alert:
      type: std_msgs/msg/Bool
      default_topic: /robot1/collision_alert

  services:
    set_mode:
      type: std_srvs/srv/SetBool
      default_name: /robot1/set_mode

    check_collision:
      type: std_srvs/srv/Trigger
      default_name: /robot1/check_collision
