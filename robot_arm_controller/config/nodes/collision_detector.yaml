node:
  name: collision_detector
  namespace: ""

  executor:
    type: multi_threaded
    threads: 2

  callback_groups:
    - name: safety_group
      type: mutually_exclusive

  # Subscribes to joint states to monitor arm position
  subscribers:
    - interface: joint_states
      qos: sensor_qos
      callback_group: safety_group

  # Publishes an alert when proximity threshold is breached
  publishers:
    - interface: collision_alert
      qos: reliable_qos

  # Serves the check_collision service that arm_controller calls
  service_servers:
    - interface: check_collision
      callback_group: safety_group

  # Periodic safety scan independent of service calls
  timers:
    - name: safety_check
      rate_hz: 50.0
      callback_group: safety_group

  parameters: collision_detector
