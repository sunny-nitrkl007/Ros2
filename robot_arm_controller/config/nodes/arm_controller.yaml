# V3 change: node is no longer a single-role entity.
# One node YAML now declares ALL roles this node plays simultaneously.

node:
  name: arm_controller
  namespace: ""               # inherits /robot1 from application.yaml

  executor:
    type: multi_threaded
    threads: 4

  # Callback groups control which callbacks can run concurrently.
  # mutually_exclusive: only one callback at a time in this group
  # reentrant: multiple callbacks can run simultaneously in this group
  callback_groups:
    - name: control_group
      type: mutually_exclusive
    - name: service_group
      type: reentrant

  # ROLE 1 — Publishers
  publishers:
    - interface: joint_states       # references interfaces.yaml
      qos: sensor_qos
    - interface: arm_status
      qos: reliable_qos

  # ROLE 2 — Subscribers
  subscribers:
    - interface: joint_commands
      qos: reliable_qos
      callback_group: control_group

  # ROLE 3 — Service servers (this node exposes)
  service_servers:
    - interface: set_mode
      callback_group: service_group

  # ROLE 4 — Service clients (this node calls into other nodes)
  service_clients:
    - interface: check_collision

  # ROLE 5 — Timers (explicit, configurable rate)
  timers:
    - name: control_loop
      rate_hz: 100.0
      callback_group: control_group

  parameters: arm_controller
