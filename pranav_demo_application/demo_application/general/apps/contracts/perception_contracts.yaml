contracts:
  - name: perception_system
    interfaces:
      - name: perception_cmd
        interactions:

          - name: pub_obstacle_data
            type: pub-sub
            topic_name: obstacle_data
            qos_profile: pub_default_qos
            dataref:
              - obstacle_data_

          - name: sub_emergency_state
            type: pub-sub
            topic_name: emergency_brake
            qos_profile: sub_default_qos
            dataref:
              - emergency_brake_data

          - name: server_get_lane_info
            type: service
            service_name: get_lane_info
            qos_profile: server_default_qos
            dataref:
              - get_lane_info_data

          - name: client_request_path_update
            type: service
            role: client
            service_name: request_path_update
            qos_profile: client_default_qos
            dataref:
              - request_path_update_data

node:
  name: perception_node
  package: perception_pkg
  executable: perception_exec
  namespace: "/perception"
  parameter_ref: perception_system_parameters
  discovery_profile: standard_ecu