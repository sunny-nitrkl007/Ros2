discovery:
  mode: server          # server | simple (simple = default DDS multicast)
  server_ip: 127.0.0.1
  server_port: 11811
  server_id: 0          # matches -i flag: fastdds discovery -i 0 -p 11811

  # How to use manually:
  #   1. Start discovery server:
  #        fastdds discovery -i 0 -p 11811
  #   2. In every terminal running a node, set:
  #        export ROS_DISCOVERY_SERVER="127.0.0.1:11811"   (Linux/WSL)
  #        set    ROS_DISCOVERY_SERVER=127.0.0.1:11811      (Windows CMD)
  #        $env:ROS_DISCOVERY_SERVER="127.0.0.1:11811"     (PowerShell)
  #   3. Run nodes normally:
  #        ros2 run generated_pkg talker
  #        ros2 run generated_pkg listener
