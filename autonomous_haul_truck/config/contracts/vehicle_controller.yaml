contract:
  node:
    name: vehicle_controller
    executor:
      type: multi_threaded
      threads: 2
    parameter_ref: vehicle_controller_params

  callback_groups:
    - name: control_group
      type: mutually_exclusive
    - name: service_group
      type: reentrant

  interactions:
    - type: pub-sub
      role: consumer
      dataref: planned_route
      qos_profile: reliable_qos
      callback_group: control_group

    - type: pub-sub
      role: consumer
      dataref: hazard_alert
      qos_profile: safety_qos
      callback_group: control_group

    - type: pub-sub
      role: producer
      dataref: drive_command
      qos_profile: reliable_qos

    - type: service
      role: client
      dataref: request_stop

  timers:
    - name: control_tick
      rate_hz: 20.0
      callback_group: control_group
