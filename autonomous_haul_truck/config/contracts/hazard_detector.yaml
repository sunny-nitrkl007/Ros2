contract:
  node:
    name: hazard_detector
    executor:
      type: multi_threaded
      threads: 2
    parameter_ref: hazard_detector_params

  callback_groups:
    - name: monitor_group
      type: mutually_exclusive
    - name: service_group
      type: reentrant

  interactions:
    - type: pub-sub
      role: consumer
      dataref: obstacle_map
      qos_profile: reliable_qos
      callback_group: monitor_group

    - type: pub-sub
      role: consumer
      dataref: drive_command
      qos_profile: reliable_qos
      callback_group: monitor_group

    - type: pub-sub
      role: producer
      dataref: hazard_alert
      qos_profile: safety_qos

    - type: service
      role: server
      dataref: request_stop
      callback_group: service_group

  timers:
    - name: hazard_check
      rate_hz: 50.0
      callback_group: monitor_group
